    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }

<body>

  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<title>AI Faculty Bootcamp<\u002Ftitle>\n<script src=\"6ac0490b-14be-4afe-a142-7c90e917fc33\"><\u002Fscript>\n<meta name=\"hz:slide-selector\" content=\"[data-canvas-width]\"><meta name=\"hz:canvas-width\" content=\"1440\"><meta name=\"hz:canvas-height\" content=\"5800\"><\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&amp;family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&amp;display=swap\">\n<style>\nbody{margin:0;background:#FFFFFF}\na{color:#74592F}a:hover{color:#555960}\nbutton{font:inherit}\nsection[id]{scroll-margin-top:84px}\n@media (max-width: 900px){.navsec{display:none !important}}\n@keyframes riseIn{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:none}}\n@keyframes fadeIn{from{opacity:0}to{opacity:1}}\n.rise{animation:riseIn .75s cubic-bezier(.2,.7,.2,1) both}\n.rise1{animation:riseIn .75s cubic-bezier(.2,.7,.2,1) .15s both}\n.rise2{animation:riseIn .75s cubic-bezier(.2,.7,.2,1) .3s both}\n.rise3{animation:riseIn .75s cubic-bezier(.2,.7,.2,1) .45s both}\n.fade{animation:fadeIn .45s ease both}\n.navbtn{background:none;border:0;color:#FFFFFF;cursor:pointer;font-size:16px;padding:8px 0;min-height:44px}\n.navbtn:hover{color:#EBD99F}\n.cont:hover{background:#2B2D31 !important}\n.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}\n.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}\n@media (max-width: 960px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media (max-width: 760px){.grid3,.grid4{grid-template-columns:minmax(0,1fr)}}\n@media (prefers-reduced-motion: reduce){.rise,.rise1,.rise2,.rise3,.fade{animation:none}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"background: #FFFFFF; color: #2B2D31; font-family: 'Source Sans 3', system-ui, sans-serif; font-size: 18px; line-height: 1.6\" data-canvas-width=\"1440\" data-canvas-height=\"5800\" data-document-role=\"page\" data-label=\"Bootcamp landing page\">\n\n<header style=\"position: sticky; top: 0; z-index: 50; background: #555960\">\n<nav aria-label=\"Main\" style=\"max-width: 1160px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px\">\n<a href=\"#top\" style=\"display: flex; flex-direction: column; line-height: 1.2; text-decoration: none; color: #FFFFFF\">\n<span style=\"font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 19px\">AI Faculty Bootcamp<\u002Fspan>\n<span style=\"font-size: 13px; color: #EBD99F\">CELT · Purdue University Fort Wayne<\u002Fspan>\n<\u002Fa>\n<div style=\"display: flex; align-items: center; gap: 22px\">\n<button type=\"button\" class=\"navbtn navsec\" sc-camel-on-click=\"{{ go1 }}\">Why<\u002Fbutton>\n<button type=\"button\" class=\"navbtn navsec\" sc-camel-on-click=\"{{ go2 }}\">What you gain<\u002Fbutton>\n<button type=\"button\" class=\"navbtn navsec\" sc-camel-on-click=\"{{ go3 }}\">Approach<\u002Fbutton>\n<button type=\"button\" class=\"navbtn navsec\" sc-camel-on-click=\"{{ go4 }}\">Your path<\u002Fbutton>\n<button type=\"button\" class=\"navbtn navsec\" sc-camel-on-click=\"{{ go5 }}\">Next steps<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ go4 }}\" style=\"background: {{accent}}; color: #2B2D31; border: 0; cursor: pointer; font-weight: 600; font-size: 16px; padding: 10px 18px; min-height: 44px; border-radius: 4px; white-space: nowrap\">Find your path<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fnav>\n<div role=\"progressbar\" aria-label=\"Steps opened\" aria-valuemin=\"0\" aria-valuemax=\"5\" aria-valuenow=\"{{ revealed }}\" style=\"height: 4px; background: #3E4046\">\n<div style=\"height: 4px; width: {{ progressPct }}%; background: {{accent}}; transition: width .6s ease\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fheader>\n\n<section id=\"top\" style=\"background: #F3F2F1; color: #2B2D31\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 72px 24px 56px; display: flex; flex-wrap: wrap; gap: 56px; align-items: center\">\n<div class=\"rise\" style=\"flex: 1 1 500px; min-width: 0; display: flex; flex-direction: column; gap: 22px\">\n<p style=\"margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #74592F\">CELT presents · January 2027<\u002Fp>\n<h1 style=\"margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: clamp(44px, 6vw, 76px); line-height: 1.02\">AI Faculty Bootcamp<\u002Fh1>\n<p style=\"margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: clamp(24px, 2.6vw, 32px); line-height: 1.25; color: #74592F\">Design with AI, not around it.<\u002Fp>\n<p style=\"margin: 0; font-size: 20px; max-width: 540px\">Hands-on sessions that help PFW faculty bring AI into one real course, thoughtfully, and ready for Spring 2027.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px 24px; font-size: 16px; font-weight: 600; color: #555960\">\n<span>Tue, Jan 5 and Thu, Jan 7, 2027<\u002Fspan><span>In person, 9:00–3:30<\u002Fspan><span>Plus an online route<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding-top: 6px\">\n<button type=\"button\" class=\"cont\" sc-camel-on-click=\"{{ go1 }}\" style=\"background: #555960; color: #FFFFFF; border: 0; cursor: pointer; font-weight: 600; font-size: 18px; padding: 14px 28px; min-height: 44px; border-radius: 4px; display: inline-flex; align-items: center; gap: 10px\">Start the 2-minute tour <svg aria-hidden=\"true\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M6 13l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ showAll }}\" style=\"background: none; border: 0; color: #2B2D31; cursor: pointer; font-size: 16px; text-decoration: underline; padding: 10px 4px; min-height: 44px\">Show the whole page<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rise1\" style=\"flex: 1 1 420px; min-width: 0; background: #FFFFFF; border-radius: 12px; padding: 40px 32px; display: flex; align-items: center; justify-content: center\">\n<img src=\"883387f8-80dd-4d0d-b6b2-6c5bd5b88c49\" alt=\"Illustration of two colleagues working together at a laptop\" style=\"width: 100%; max-width: 460px; height: auto; display: block\">\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px 40px\">\n<ol aria-label=\"The tour in five steps\" style=\"margin: 0; padding: 20px 0 0; list-style: none; border-top: 1px solid #DCD8D2; display: flex; flex-wrap: wrap; gap: 8px 28px\">\n<sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"5\">\n<li>\n<button type=\"button\" sc-camel-on-click=\"{{ st.go }}\" style=\"background: none; border: 0; color: #2B2D31; cursor: pointer; font-size: 15px; padding: 6px 0; min-height: 44px; display: inline-flex; align-items: center; gap: 8px\">\n<sc-if value=\"{{ st.done }}\" hint-placeholder-val=\"{{ false }}\"><span aria-hidden=\"true\" style=\"width: 22px; height: 22px; border-radius: 50%; background: {{accent}}; color: #2B2D31; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700\">✓<\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{ st.todo }}\" hint-placeholder-val=\"{{ true }}\"><span aria-hidden=\"true\" style=\"width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #74592F; color: #74592F; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; box-sizing: border-box\">{{ st.n }}<\u002Fspan><\u002Fsc-if>\n<span>{{ st.label }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fsection>\n\n<sc-if value=\"{{ show1 }}\" hint-placeholder-val=\"{{ false }}\">\n<section id=\"why\" aria-labelledby=\"why-h\" style=\"max-width: 1160px; margin: 0 auto; padding: 104px 24px 72px; display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start\">\n<div class=\"rise\" style=\"flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #74592F\">Step 1 of 5 · Why it matters<\u002Fspan>\n<h2 id=\"why-h\" style=\"margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: clamp(32px, 3.6vw, 46px); line-height: 1.1\">Your students are already using AI.<\u002Fh2>\n<\u002Fdiv>\n<div class=\"rise1\" style=\"flex: 2 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 20px; font-size: 20px; color: #3E4046\">\n<p style=\"margin: 0\">The real question isn't whether AI belongs in your course. It's <strong style=\"color: #2B2D31\">where<\u002Fstrong> it belongs, and where it would undercut the learning you care about.<\u002Fp>\n<p style=\"margin: 0\">This bootcamp gives you time, structure and colleagues to answer that question for one of your own courses, and leave with something you can use.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{ cont1 }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"fade\" style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px 96px; display: flex; align-items: center; gap: 20px\"><span aria-hidden=\"true\" style=\"flex: 1; height: 1px; background: #DCD8D2\"><\u002Fspan><button type=\"button\" class=\"cont\" sc-camel-on-click=\"{{ go2 }}\" style=\"background: #555960; color: #FFFFFF; border: 0; cursor: pointer; font-weight: 600; font-size: 17px; padding: 14px 32px; min-height: 44px; border-radius: 999px\">Continue: What you'll gain<\u002Fbutton><span aria-hidden=\"true\" style=\"flex: 1; height: 1px; background: #DCD8D2\"><\u002Fspan><\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ show2 }}\" hint-placeholder-val=\"{{ false }}\">\n<section id=\"gain\" aria-labelledby=\"gain-h\" style=\"background: #F3F2F1\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 44px\">\n<div class=\"rise\" style=\"display: flex; flex-direction: column; gap: 10px; max-width: 760px\">\n<span style=\"font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #74592F\">Step 2 of 5 · What you'll gain<\u002Fspan>\n<h2 id=\"gain-h\" style=\"margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: clamp(32px, 3.6vw, 46px); line-height: 1.1\">You leave with three things.<\u002Fh2>\n<\u002Fdiv>\n<div class=\"grid3\">\n<div class=\"rise1\" style=\"min-width: 0; background: #FFFFFF; border-radius: 6px; border-top: 4px solid {{accent}}; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg aria-hidden=\"true\" width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#74592F\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"9\" r=\"6\"><\u002Fcircle><path d=\"M8.5 14l-1.5 7 5-3 5 3-1.5-7\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 23px\">A credential<\u002Fh3>\n<p style=\"margin: 0; color: #555960\">A certificate for your path.<\u002Fp>\n<\u002Fdiv>\n<div class=\"rise2\" style=\"min-width: 0; background: #FFFFFF; border-radius: 6px; border-top: 4px solid #DAAA00; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg aria-hidden=\"true\" width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#74592F\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"13\" rx=\"2\"><\u002Frect><path d=\"M8 21h8M12 17v4\"><\u002Fpath><path d=\"M8 10.5h.01M12 10.5h.01M16 10.5h.01\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 23px\">A design assistant<\u002Fh3>\n<p style=\"margin: 0; color: #555960\">Your own Copilot planning agent.<\u002Fp>\n<\u002Fdiv>\n<div class=\"rise3\" style=\"min-width: 0; background: #FFFFFF; border-radius: 6px; border-top: 4px solid #74592F; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg aria-hidden=\"true\" width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#74592F\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z\"><\u002Fpath><path d=\"M14 3v6h6\"><\u002Fpath><path d=\"M9 14l2 2 4-4\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 23px\">A ready activity<\u002Fh3>\n<p style=\"margin: 0; color: #555960\">One activity for Spring 2027.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"rise3\" style=\"margin: 0; color: #555960\"><strong style=\"color: #2B2D31\">Scope:<\u002Fstrong> one course, one learning objective, one activity. Small enough to finish, real enough to use.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{ cont2 }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"fade\" style=\"background: #F3F2F1\"><div style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px 96px; display: flex; align-items: center; gap: 20px\"><span aria-hidden=\"true\" style=\"flex: 1; height: 1px; background: #DCD8D2\"><\u002Fspan><button type=\"button\" class=\"cont\" sc-camel-on-click=\"{{ go3 }}\" style=\"background: #555960; color: #FFFFFF; border: 0; cursor: pointer; font-weight: 600; font-size: 17px; padding: 14px 32px; min-height: 44px; border-radius: 999px\">Continue: Our approach<\u002Fbutton><span aria-hidden=\"true\" style=\"flex: 1; height: 1px; background: #DCD8D2\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ show3 }}\" hint-placeholder-val=\"{{ false }}\">\n<section id=\"approach\" aria-labelledby=\"approach-h\" style=\"background: #EBD99F; color: #2B2D31\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 40px\">\n<div class=\"rise\" style=\"display: flex; flex-direction: column; gap: 10px; max-width: 760px\">\n<span style=\"font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5C4824\">Step 3 of 5 · Our approach<\u002Fspan>\n<h2 id=\"approach-h\" style=\"margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: clamp(32px, 3.6vw, 46px); line-height: 1.1\">AI where it helps, never in place of learning.<\u002Fh2>\n<p style=\"margin: 0; color: #3E4046\">Every activity you design follows three principles. Open each card to see it applied in an introductory biology course.<\u002Fp>\n<\u002Fdiv>\n<div class=\"grid3\">\n<sc-for list=\"{{ principles }}\" as=\"p\" hint-placeholder-count=\"3\">\n<div class=\"{{ p.cls }}\" style=\"min-width: 0; display: flex\">\n<sc-if value=\"{{ p.closed }}\" hint-placeholder-val=\"{{ true }}\">\n<button type=\"button\" sc-camel-on-click=\"{{ p.toggle }}\" aria-expanded=\"false\" style=\"flex: 1; text-align: left; cursor: pointer; border: 0; background: #FFFFFF; color: #2B2D31; border-radius: 6px; padding: 32px; display: flex; flex-direction: column; gap: 12px; min-height: 260px\">\n<span style=\"font-size: 14px; font-weight: 700; color: #74592F\">Principle {{ p.n }}<\u002Fspan>\n<span style=\"font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 25px; line-height: 1.2\">{{ p.title }}<\u002Fspan>\n<span style=\"color: #555960\">{{ p.line }}<\u002Fspan>\n<span style=\"margin-top: auto; font-weight: 600; color: #555960; display: inline-flex; align-items: center; gap: 8px\">See an example <svg aria-hidden=\"true\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{ p.open }}\" hint-placeholder-val=\"{{ false }}\">\n<button type=\"button\" sc-camel-on-click=\"{{ p.toggle }}\" aria-expanded=\"true\" class=\"fade\" style=\"flex: 1; text-align: left; cursor: pointer; border: 0; background: #555960; color: #FFFFFF; border-radius: 6px; padding: 32px; display: flex; flex-direction: column; gap: 12px; min-height: 260px\">\n<span style=\"font-size: 14px; font-weight: 700; color: #EBD99F\">In practice<\u002Fspan>\n<span style=\"font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.25\">{{ p.example }}<\u002Fspan>\n<span style=\"margin-top: auto; font-weight: 600; color: #EBD99F\">Back to the principle<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{ cont3 }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"fade\" style=\"background: #EBD99F\"><div style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px 96px; display: flex; align-items: center; gap: 20px\"><span aria-hidden=\"true\" style=\"flex: 1; height: 1px; background: #C9B77E\"><\u002Fspan><button type=\"button\" class=\"cont\" sc-camel-on-click=\"{{ go4 }}\" style=\"background: #555960; color: #FFFFFF; border: 0; cursor: pointer; font-weight: 600; font-size: 17px; padding: 14px 32px; min-height: 44px; border-radius: 999px\">Continue: Choose your path<\u002Fbutton><span aria-hidden=\"true\" style=\"flex: 1; height: 1px; background: #C9B77E\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ show4 }}\" hint-placeholder-val=\"{{ false }}\">\n<section id=\"paths\" aria-labelledby=\"paths-h\" style=\"max-width: 1160px; margin: 0 auto; padding: 104px 24px 72px; display: flex; flex-direction: column; gap: 32px\">\n<div class=\"rise\" style=\"display: flex; flex-direction: column; gap: 10px; max-width: 760px\">\n<span style=\"font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #74592F\">Step 4 of 5 · Choose your path<\u002Fspan>\n<h2 id=\"paths-h\" style=\"margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: clamp(32px, 3.6vw, 46px); line-height: 1.1\">Do you have the AI for Educators certificate?<\u002Fh2>\n<p style=\"margin: 0; color: #555960\">Earned in the last two years. Your answer decides where you start.<\u002Fp>\n<\u002Fdiv>\n<div class=\"rise1\" role=\"group\" aria-label=\"Your answer\" style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center\">\n<sc-if value=\"{{ ansNo }}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" sc-camel-on-click=\"{{ answerNo }}\" aria-pressed=\"true\" style=\"padding: 14px 30px; min-height: 44px; cursor: pointer; font-weight: 600; font-size: 17px; border: 1.5px solid #555960; background: #555960; color: #FFFFFF; border-radius: 4px\">Not yet<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{ notAnsNo }}\" hint-placeholder-val=\"{{ true }}\"><button type=\"button\" sc-camel-on-click=\"{{ answerNo }}\" aria-pressed=\"false\" style=\"padding: 14px 30px; min-height: 44px; cursor: pointer; font-weight: 600; font-size: 17px; border: 1.5px solid #555960; background: #FFFFFF; color: #2B2D31; border-radius: 4px\">Not yet<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{ ansYes }}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" sc-camel-on-click=\"{{ answerYes }}\" aria-pressed=\"true\" style=\"padding: 14px 30px; min-height: 44px; cursor: pointer; font-weight: 600; font-size: 17px; border: 1.5px solid #555960; background: #555960; color: #FFFFFF; border-radius: 4px\">Yes, I have it<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{ notAnsYes }}\" hint-placeholder-val=\"{{ true }}\"><button type=\"butto f>\n\n<sc-if value=\"{{ showYesPaths }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"fade\" style=\"flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<p style=\"margin: 0; font-weight: 700; font-size: 19px; padding-bottom: 10px; border-bottom: 2px solid #74592F\">Yes: Start with Applied Design<\u002Fp>\n<article class=\"rise\" style=\"flex-grow: 1; border: 1px solid #DCD8D2; border-radius: 6px; display: flex; flex-direction: column\">\n<div style=\"background: #F3F2F1; padding: 24px; display: flex; justify-content: center\"><img src=\"9948f224-1188-468f-8459-8a310c679476\" alt=\"\" style=\"width: 100%; max-width: 240px; height: 130px; object-fit: contain\"><\u002Fdiv>\n<div style=\"padding: 24px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1\">\n<span style=\"align-self: flex-start; background: #EEECE8; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 3px\">Thursday, January 7 · in person<\u002Fspan>\n<h3 style=\"margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 24px\">Applied Design<\u002Fh3>\n<dl style=\"margin: 0; display: flex; flex-direction: column; gap: 12px\"><div style=\"display: flex; flex-direction: column; gap: 2px; padding-top: 10px; border-top: 1px solid #ECE9E4\"><dt style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #74592F\">Before<\u002Fdt><dd style=\"margin: 0; color: #3E4046\">Send a short project proposal by <strong style=\"color: #2B2D31\">December 20<\u002Fstrong>: your course, one learning objective and your SAMR target.<\u002Fdd><\u002Fdiv><div style=\"display: flex; flex-direction: column; gap: 2px; padding-top: 10px; border-top: 1px solid #ECE9E4\"><dt style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #74592F\">What you do<\u002Fdt><dd style=\"margin: 0; color: #3E4046\">On <strong style=\"color: #2B2D31\">Thursday, January 7<\u002Fstrong>, build your own Copilot agent and use it to design one AI-integrated activity.<\u002Fdd><\u002Fdiv><div style=\"display: flex; flex-direction: column; gap: 2px; padding-top: 10px; border-top: 1px solid #ECE9E4\"><dt style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #74592F\">You earn<\u002Fdt><dd style=\"margin: 0; color: #3E4046\"><strong style=\"color: #2B2D31\">AI Integration Design Certificate<\u002Fstrong><\u002Fdd><\u002Fdiv><\u002Fdl>\n<a href=\"[APPLIED DESIGN PROPOSAL LINK]\" style=\"margin-top: auto; background: #555960; color: #FFFFFF; text-decoration: none; font-weight: 600; padding: 12px 18px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; border-radius: 4px\">Submit your proposal<\u002Fa>\n<\u002Fdiv>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<sc-if value=\"{{ answered }}\" hint-placeholder-val=\"{{ false }}\">\n<p class=\"fade\" style=\"margin: 0; color: #555960; font-size: 16px\">Foundations and Applied Design are separate one-day sessions. In January, you attend one.<\u002Fp>\n<\u002Fsc-if>\n<\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{ cont4 }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"fade\" style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px 96px; display: flex; align-items: center; gap: 20px\"><span aria-hidden=\"true\" style=\"flex: 1; height: 1px; background: #DCD8D2\"><\u002Fspan><button type=\"button\" class=\"cont\" sc-camel-on-click=\"{{ go5 }}\" style=\"background: #555960; color: #FFFFFF; border: 0; cursor: pointer; font-weight: 600; font-size: 17px; padding: 14px 32px; min-height: 44px; border-radius: 999px\">Continue: Next steps<\u002Fbutton><span aria-hidden=\"true\" style=\"flex: 1; height: 1px; background: #DCD8D2\"><\u002Fspan><\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ show5 }}\" hint-placeholder-val=\"{{ false }}\">\n<section id=\"next\" aria-labelledby=\"next-h\" style=\"background: #F3F2F1; color: #2B2D31\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 44px\">\n<div class=\"rise\" style=\"display: flex; flex-direction: column; gap: 10px; max-width: 760px\">\n<span style=\"font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #74592F\">Step 5 of 5 · Next steps<\u002Fspan>\n<h2 id=\"next-h\" style=\"margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: clamp(32px, 3.6vw, 46px); line-height: 1.1\">From today to January<\u002Fh2>\n<\u002Fdiv>\n<ol class=\"grid4\" style=\"margin: 0; padding: 0; list-style: none\">\n<li class=\"rise\" style=\"min-width: 0; background: #FFFFFF; border-radius: 6px; border-top: 4px solid {{accent}}; padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 6px\">\n<span style=\"color: #74592F; font-weight: 700\">Today<\u002Fspan>\n<span style=\"font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.2\">Pick your path<\u002Fspan>\n<span style=\"color: #555960\">Enroll online, register for Foundations, or start your proposal.<\u002Fspan>\n<\u002Fli>\n<li class=\"rise1\" style=\"min-width: 0; background: #FFFFFF; border-radius: 6px; border-top: 4px solid #DAAA00; padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 6px\">\n<span style=\"color: #74592F; font-weight: 700\">By December 20<\u002Fspan>\n<span style=\"font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.2\">Finish and submit<\u002Fspan>\n<span style=\"color: #555960\">Online course and Applied Design proposals are due.<\u002Fspan>\n<\u002Fli>\n<li class=\"rise2\" style=\"min-width: 0; background: #FFFFFF; border-radius: 6px; border-top: 4px solid #DDB945; padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 6px\">\n<span style=\"color: #74592F; font-weight: 700\">Early January<\u002Fspan>\n<span style=\"font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.2\">Get feedback<\u002Fspan>\n<span style=\"color: #555960\">Proposal feedback and the rubric arrive before Applied Design.<\u002Fspan>\n<\u002Fli>\n<li class=\"rise3\" style=\"min-width: 0; background: #FFFFFF; border-radius: 6px; border-top: 4px solid #74592F; padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 6px\">\n<span style=\"color: #74592F; font-weight: 700\">Tue, Jan 5 or Thu, Jan 7<\u002Fspan>\n<span style=\"font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.2\">Join us<\u002Fspan>\n<span style=\"color: #555960\">9:00–3:30 · [ROOM, BUILDING] · bring a laptop.<\u002Fspan>\n<\u002Fli>\n<\u002Fol>\n\n<div class=\"rise3\" style=\"background: #FFFFFF; color: #2B2D31; border-radius: 8px; padding: 28px; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between\">\n<h3 style=\"margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 24px\">Inside the day<\u002Fh3>\n<div role=\"tablist\" aria-label=\"Choose a session\" style=\"display: flex; flex-wrap: wrap; gap: 6px; background: #EEECE8; padding: 6px; border-radius: 6px\">\n<sc-if value=\"{{ isDay1 }}\" hint-placeholder-val=\"{{ true }}\">\n<button type=\"button\" role=\"tab\" aria-selected=\"true\" sc-camel-on-click=\"{{ showDay1 }}\" style=\"border: 0; padding: 10px 16px; min-height: 44px; cursor: pointer; font-weight: 600; font-size: 16px; background: #555960; color: #FFFFFF; border-radius: 4px\">Foundations · Tue, Jan 5<\u002Fbutton>\n<button type=\"button\" role=\"tab\" aria-selected=\"false\" sc-camel-on-click=\"{{ showDay2 }}\" style=\"border: 0; padding: 10px 16px; min-height: 44px; cursor: pointer; font-weight: 600; font-size: 16px; background: transparent; color: #2B2D31; border-radius: 4px\">Applied Design · Thu, Jan 7<\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{ isDay2 }}\" hint-placeholder-val=\"{{ false }}\">\n<button type=\"button\" role=\"tab\" aria-selected=\"false\" sc-camel-on-click=\"{{ showDay1 }}\" style=\"border: 0; padding: 10px 16px; min-height: 44px; cursor: pointer; font-weight: 600; font-size: 16px; background: transparent; color: #2B2D31; border-radius: 4px\">Foundations · Tue, Jan 5<\u002Fbutton>\n<button type=\"button\" role=\"tab\" aria-selected=\"true\" sc-camel-on-click=\"{{ showDay2 }}\" style=\"border: 0; padding: 10px 16px; min-height: 44px; cursor: pointer; font-weight: 600; font-size: 16px; background: #555960; color: #FFFFFF; border-radius: 4px\">Applied Design · Thu, Jan 7<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<div role=\"tabpanel\" aria-label=\"{{ panelLabel }}\" style=\"display: flex; flex-direction: column\">\n<sc-for list=\"{{ rows }}\" as=\"row\" hint-placeholder-count=\"6\">\n<div class=\"fade\" style=\"display: flex; flex-wrap: wrap; gap: 2px 32px; padding: 12px 0; border-top: 1px solid #E6E3DE\">\n<span style=\"flex: 0 0 120px; font-weight: 600; color: #74592F\">{{ row.time }}<\u002Fspan>\n<span style=\"flex: 1 1 280px; min-width: 0\">{{ row.title }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"faq\" aria-labelledby=\"faq-h\" style=\"max-width: 1160px; margin: 0 auto; padding: 96px 24px; display: flex; flex-wrap: wrap; gap: 48px\">\n<h2 id=\"faq-h\" class=\"rise\" style=\"flex: 1 1 300px; margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: clamp(32px, 3.6vw, 46px); line-height: 1.1\">Still wondering?<\u002Fh2>\n<div class=\"rise1\" style=\"flex: 2 1 560px; min-width: 0; display: flex; flex-direction: column; border-top: 1px solid #DCD8D2\">\n<sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"5\">\n<div style=\"border-bottom: 1px solid #DCD8D2\">\n<button type=\"button\" sc-camel-on-click=\"{{ f.toggle }}\" aria-expanded=\"{{ f.expanded }}\" style=\"width: 100%; background: none; border: 0; color: #2B2D31; text-align: left; padding: 20px 0; min-height: 44px; display: flex; justify-content: space-between; align-items: center; gap: 16px; cursor: pointer; font-size: 19px; font-weight: 600\">\n<span>{{ f.q }}<\u002Fspan>\n<span aria-hidden=\"true\" style=\"font-size: 24px; color: #74592F\">{{ f.sign }}<\u002Fspan>\n<\u002Fbutton>\n<sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\">\n<p class=\"fade\" style=\"margin: 0; padding: 0 40px 22px 0; color: #555960\">{{ f.a }}<\u002Fp>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section aria-labelledby=\"close-h\" style=\"background: {{accent}}; color: #2B2D31\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 80px 24px; display: flex; flex-wrap: wrap; gap: 32px; align-items: center; justify-content: space-between\">\n<div style=\"flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 10px\">\n<h2 id=\"close-h\" style=\"margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: clamp(32px, 4vw, 52px); line-height: 1.08\">Your Spring 2027 course starts here.<\u002Fh2>\n<p style=\"margin: 0; font-size: 19px\">Choose your path by December 20. Seats are limited.<\u002Fp>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ go4 }}\" style=\"background: #555960; color: #FFFFFF; border: 0; cursor: pointer; font-weight: 600; font-size: 18px; padding: 16px 30px; min-height: 44px; border-radius: 4px\">Find your path<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<footer style=\"background: #555960; color: #FFFFFF\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 40px 24px 48px; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; font-size: 15px\">\n<span>AI Faculty Bootcamp · Center for the Enhancement of Learning and Teaching (CELT) · Purdue University Fort Wayne<\u002Fspan>\n<span>Questions: <a href=\"mailto:[CONTACT EMAIL]\" style=\"color: #EBD99F\">[CONTACT EMAIL]<\u002Fa><\u002Fspan>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#CFB991&quot;,&quot;options&quot;:[&quot;#CFB991&quot;,&quot;#DDB945&quot;,&quot;#EBD99F&quot;]},&quot;startOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:5800}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { revealed: props && props.startOpen ? 5 : 0, tab: 'day1', faq: -1, elig: null, flip: {} };\n  }\n  scrollTo(id) {\n    setTimeout(function () {\n      var el = document.getElementById(id);\n      if (el && el.scrollIntoView) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }\n    }, 80);\n  }\n  goTo(n) {\n    var ids = ['top', 'why', 'gain', 'approach', 'paths', 'next'];\n    var r = (this.state && this.state.revealed) || 0;\n    var self = this;\n    this.setState({ revealed: Math.max(r, n) }, function () { self.scrollTo(ids[n]); });\n  }\n  renderVals() {\n    var self = this;\n    var s = this.state || {};\n    var accent = this.props.accent ?? '#CFB991';\n    var r = s.revealed || 0;\n    var tab = s.tab || 'day1';\n    var elig = s.elig;\n    var flip = s.flip || {};\n\n    var stepLabels = ['Why it matters', \"What you'll gain\", 'Our approach', 'Choose your path', 'Next steps'];\n    var steps = stepLabels.map(function (label, i) {\n      var n = i + 1;\n      return { n: n, label: label, done: r >= n, todo: r < n, go: function () { self.goTo(n); } };\n    });\n\n    var pData = [\n      { title: 'Check prior knowledge', line: 'Confirm students are ready before the activity begins.', example: 'A five-minute, AI-free check on tree terminology before the activity starts.' },\n      { title: 'Ensure core learning happens', line: 'The essential thinking stays with students.', example: 'Students build and defend their own phylogenetic tree from trait data, without AI.' },\n      { title: 'Enhance the experience with AI', line: 'Use AI to extend what students can explore.', example: 'Copilot proposes competing trees, and students critique where each one goes wrong.' }\n    ];\n    var principles = pData.map(function (p, i) {\n      var isOpen = !!flip[i];\n      return {\n        n: i + 1, title: p.title, line: p.line, example: p.example,\n        open: isOpen, closed: !isOpen,\n        cls: i === 0 ? 'rise1' : (i === 1 ? 'rise2' : 'rise3'),\n        toggle: function () { var f = Object.assign({}, (self.state && self.state.flip) || {}); f[i] = !f[i]; self.setState({ flip: f }); }\n      };\n    });\n\n    var day1 = [\n      { time: '9:00–10:10', title: 'Unit 1 · Generative AI basics' },\n      { time: '10:20–11:10', title: 'AI Basics Quiz and review' },\n      { time: '11:10–1:05', title: 'Unit 2 · AI for everyday teaching tasks' },\n      { time: '1:05–2:15', title: 'Unit 3 · AI and assessment redesign' },\n      { time: '2:25–3:15', title: 'Unit 4 · Ideas from PFW colleagues' },\n      { time: '3:15–3:30', title: 'Next steps toward Applied Design' }\n    ];\n    var day2 = [\n      { time: '9:00–9:40', title: 'Define your target and analyze an example' },\n      { time: '9:40–12:00', title: 'Design, build and test your Copilot agent' },\n      { time: '12:30–1:20', title: 'Plan your activity with the agent' },\n      { time: '1:20–2:20', title: 'Peer feedback and revision' },\n      { time: '2:30–3:15', title: 'Small-group demonstrations' },\n      { time: '3:15–3:30', title: 'Reflection and submission' }\n    ];\n\n    var faqData = [\n      { q: 'Can I attend both January sessions?', a: 'No. Foundations and Applied Design are separate sessions for different audiences. Foundations participants join an Applied Design cohort later in Spring 2027, after finishing Units 3–4.' },\n      { q: 'What goes in the Applied Design proposal?', a: 'Your course, one learning objective and the SAMR level you are aiming for. You’ll receive feedback and the rubric a few days before the session.' },\n      { q: 'Do I need technical skills?', a: 'No. Foundations assumes no AI experience. In Applied Design you build the agent in Copilot with plain-language instructions.' },\n      { q: 'Who uses the agent I build?', a: 'Only you. It supports your design work and never interacts with students or student data.' },\n      { q: 'What should I bring?', a: 'A laptop, Microsoft Copilot access with your Purdue account, and materials from one course you teach, such as the syllabus. Photos are taken during Applied Design demonstrations.' }\n    ];\n    var faqs = faqData.map(function (f, i) {\n      var open = s.faq === i;\n      return {\n        q: f.q, a: f.a, open: open,\n        expanded: open ? 'true' : 'false',\n        sign: open ? '−' : '+',\n        toggle: function () { self.setState({ faq: open ? -1 : i }); }\n      };\n    });\n\n    return {\n      accent: accent,\n      revealed: r,\n      progressPct: Math.round((r / 5) * 100),\n      steps: steps,\n      go1: function () { self.goTo(1); },\n      go2: function () { self.goTo(2); },\n      go3: function () { self.goTo(3); },\n      go4: function () { self.goTo(4); },\n      go5: function () { self.goTo(5); },\n      showAll: function () { self.setState({ revealed: 5, elig: elig || 'all' }, function () { self.scrollTo('why'); }); },\n      show1: r >= 1, show2: r >= 2, show3: r >= 3, show4: r >= 4, show5: r >= 5,\n      cont1: r === 1, cont2: r === 2, cont3: r === 3, cont4: r === 4,\n      principles: principles,\n      ansNo: elig === 'no', notAnsNo: elig !== 'no',\n      ansYes: elig === 'yes', notAnsYes: elig !== 'yes',\n      answerNo: function () { self.setState({ elig: 'no' }); },\n      answerYes: function () { self.setState({ elig: 'yes' }); },\n      answerAll: function () { self.setState({ elig: 'all' }); },\n      showNoPaths: elig === 'no' || elig === 'all',\n      showYesPaths: elig === 'yes' || elig === 'all',\n      answered: !!elig,\n      isDay1: tab === 'day1',\n      isDay2: tab === 'day2',\n      showDay1: function () { self.setState({ tab: 'day1' }); },\n      showDay2: function () { self.setState({ tab: 'day2' }); },\n      panelLabel: tab === 'day1' ? 'Foundations schedule' : 'Applied Design schedule',\n      rows: tab === 'day1' ? day1 : day2,\n      faqs: faqs\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
